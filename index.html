<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lead Times 2024–25 — Scatter Plot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-adapter-date-fns/3.0.0/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  :root{
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1f2328;
    --muted: #6b7280;
    --border: #e5e7eb;
    --s-color: #2e7d32;   /* S = green */
    --m-color: #1565c0;   /* M = blue */
    --l-color: #c62828;   /* L = red */
    --p50: #9ca3af;
    --p85: #f59e0b;
    --p95: #ef4444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 32px 20px;
  }
  .wrap{
    max-width: 1100px;
    margin: 0 auto;
  }
  h1{
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .subtitle{
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
  }
  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .chart-container{
    position: relative;
    height: 480px;
  }
  .legend{
    display:flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  .legend-group{
    display:flex;
    flex-direction: column;
    gap: 8px;
  }
  .legend-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dot{
    width: 10px; height: 10px; border-radius: 50%;
    display:inline-block;
  }
  .line-swatch{
    width: 16px; height: 2px; display:inline-block;
  }
  .stats{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap: 12px;
    margin-top: 20px;
  }
  .stat{
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .stat .num{
    font-size: 20px;
    font-weight: 700;
  }
  .stat .lbl{
    font-size: 12px;
    color: var(--muted);
  }
  .filters{
    display:flex;
    flex-wrap: wrap;
    gap: 28px;
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .filter-group{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .filter-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 600;
  }
  .filter-options{
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .chip{
    display:flex;
    align-items:center;
    gap: 7px;
    padding: 6px 12px 6px 10px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    cursor: pointer;
    font-size: 13px;
    background: var(--card);
    user-select: none;
    transition: border-color 0.15s, opacity 0.15s;
  }
  .chip.off{
    opacity: 0.4;
  }
  .chip input{
    display:none;
  }
  .chip .dot{
    width: 9px; height: 9px; border-radius: 50%; flex-shrink:0;
  }
  .chip .line-swatch{
    width: 14px; height: 2px; flex-shrink:0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Lead Times — 2024–25</h1>
  <p class="subtitle">Completion date vs. lead time (days), colored by declared size. Dashed lines mark the 50th, 85th, and 95th percentiles.</p>

  <div class="card">
    <div class="filters">
      <div class="filter-group">
        <span class="filter-label">Ticket size</span>
        <div class="filter-options" id="sizeFilters">
          <label class="chip" data-size="S"><input type="checkbox" checked><span class="dot" style="background:var(--s-color)"></span>S — Small</label>
          <label class="chip" data-size="M"><input type="checkbox" checked><span class="dot" style="background:var(--m-color)"></span>M — Medium</label>
          <label class="chip" data-size="L"><input type="checkbox" checked><span class="dot" style="background:var(--l-color)"></span>L — Large</label>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Percentile scenario</span>
        <div class="filter-options" id="percentileFilters">
          <label class="chip" data-pct="p50"><input type="checkbox" checked><span class="line-swatch" style="background:var(--p50)"></span>50th (<span class="pval" data-pct-val="p50"></span>d)</label>
          <label class="chip" data-pct="p85"><input type="checkbox" checked><span class="line-swatch" style="background:var(--p85)"></span>85th (<span class="pval" data-pct-val="p85"></span>d)</label>
          <label class="chip" data-pct="p95"><input type="checkbox" checked><span class="line-swatch" style="background:var(--p95)"></span>95th (<span class="pval" data-pct-val="p95"></span>d)</label>
        </div>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="scatterChart"></canvas>
    </div>

    <div class="stats" id="statBox"></div>
  </div>
</div>

<script>
const rows = [["2024-07-15","S",49.0],["2024-08-22","S",48.0],["2024-09-10","S",87.0],["2024-09-25","M",57.0],["2024-10-05","M",148.0],["2024-10-14","S",53.0],["2024-10-28","S",45.0],["2024-11-18","M",145.0],["2024-12-04","L",105.0],["2025-01-08","S",5.0],["2025-01-20","L",163.0],["2025-02-14","S",43.0],["2025-02-26","M",415.0],["2025-03-15","L",123.0],["2025-04-10","M",103.0],["2025-05-05","L",104.0],["2025-06-12","L",302.0],["2025-06-25","L",158.0],["2025-07-02","L",98.0],["2025-07-11","S",52.0],["2025-07-18","M",95.0],["2025-07-29","S",70.0],["2025-08-03","M",95.0],["2025-08-14","M",101.0],["2025-08-21","M",57.0],["2025-08-29","M",57.0],["2025-09-08","S",53.0],["2025-09-22","L",137.0],["2025-10-04","S",73.0],["2025-10-12","M",60.0],["2025-10-19","S",126.0],["2025-10-27","M",57.0],["2025-11-05","L",124.0],["2025-11-15","M",75.0],["2025-11-25","M",89.0],["2025-12-10","S",44.0]];

const colors = { S: getComputedCssVar('--s-color'), M: getComputedCssVar('--m-color'), L: getComputedCssVar('--l-color') };
function getComputedCssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

const bySize = { S: [], M: [], L: [] };
rows.forEach(([d, size, lead]) => {
  bySize[size].push({ x: d, y: lead });
});

// Percentiles (precomputed from full dataset, 36 points)
const p50 = 88.0;
const p85 = 143.0;
const p95 = 197.75;

const minDate = rows[0][0];
const maxDate = rows[rows.length - 1][0];

document.querySelectorAll('.pval').forEach(el => {
  const key = el.getAttribute('data-pct-val');
  el.textContent = { p50, p85, p95 }[key];
});

const ctx = document.getElementById('scatterChart').getContext('2d');
const chart = new Chart(ctx, {
  type: 'scatter',
  data: {
    datasets: [
      {
        label: 'S — Small',
        data: bySize.S,
        backgroundColor: colors.S,
        borderColor: colors.S,
        pointRadius: 5,
        pointHoverRadius: 7
      },
      {
        label: 'M — Medium',
        data: bySize.M,
        backgroundColor: colors.M,
        borderColor: colors.M,
        pointRadius: 5,
        pointHoverRadius: 7
      },
      {
        label: 'L — Large',
        data: bySize.L,
        backgroundColor: colors.L,
        borderColor: colors.L,
        pointRadius: 5,
        pointHoverRadius: 7
      },
      {
        label: '50th percentile (' + p50 + 'd)',
        type: 'line',
        data: [{x: minDate, y: p50}, {x: maxDate, y: p50}],
        borderColor: getComputedCssVar('--p50'),
        borderWidth: 2,
        borderDash: [6,4],
        pointRadius: 0,
        fill: false
      },
      {
        label: '85th percentile (' + p85 + 'd)',
        type: 'line',
        data: [{x: minDate, y: p85}, {x: maxDate, y: p85}],
        borderColor: getComputedCssVar('--p85'),
        borderWidth: 2,
        borderDash: [6,4],
        pointRadius: 0,
        fill: false
      },
      {
        label: '95th percentile (' + p95 + 'd)',
        type: 'line',
        data: [{x: minDate, y: p95}, {x: maxDate, y: p95}],
        borderColor: getComputedCssVar('--p95'),
        borderWidth: 2,
        borderDash: [6,4],
        pointRadius: 0,
        fill: false
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'nearest', intersect: true },
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: function(context) {
            if (context.dataset.type === 'line') return context.dataset.label;
            const size = context.dataset.label.split(' ')[0];
            const d = context.raw.x;
            return `${d} · Size ${size} · ${context.raw.y} days`;
          }
        }
      }
    },
    scales: {
      x: {
        type: 'time',
        time: { unit: 'month', tooltipFormat: 'MMM d, yyyy' },
        title: { display: true, text: 'Completion Date' },
        grid: { color: '#eef0f2' }
      },
      y: {
        title: { display: true, text: 'Lead Time (days)' },
        beginAtZero: true,
        grid: { color: '#eef0f2' }
      }
    }
  }
});

// Dataset index map
const sizeDatasetIndex = { S: 0, M: 1, L: 2 };
const pctDatasetIndex = { p50: 3, p85: 4, p95: 5 };

function updateStats() {
  const activeSizes = Array.from(document.querySelectorAll('#sizeFilters .chip'))
    .filter(chip => chip.querySelector('input').checked)
    .map(chip => chip.getAttribute('data-size'));

  const activeLeads = rows.filter(r => activeSizes.includes(r[1])).map(r => r[2]);

  if (activeLeads.length === 0) {
    document.getElementById('statBox').innerHTML = `
      <div class="stat"><div class="num">0</div><div class="lbl">Orders</div></div>
      <div class="stat"><div class="num">—</div><div class="lbl">Average lead time</div></div>
      <div class="stat"><div class="num">—</div><div class="lbl">Max lead time</div></div>
    `;
    return;
  }

  const avg = (activeLeads.reduce((a,b)=>a+b,0)/activeLeads.length).toFixed(1);
  const max = Math.max(...activeLeads);
  document.getElementById('statBox').innerHTML = `
    <div class="stat"><div class="num">${activeLeads.length}</div><div class="lbl">Orders shown</div></div>
    <div class="stat"><div class="num">${avg}d</div><div class="lbl">Average lead time</div></div>
    <div class="stat"><div class="num">${max}d</div><div class="lbl">Max lead time</div></div>
  `;
}

// Filter interactivity
document.querySelectorAll('#sizeFilters .chip').forEach(chip => {
  const size = chip.getAttribute('data-size');
  const input = chip.querySelector('input');
  chip.addEventListener('click', (e) => {
    e.preventDefault();
    input.checked = !input.checked;
    chip.classList.toggle('off', !input.checked);
    const idx = sizeDatasetIndex[size];
    chart.setDatasetVisibility(idx, input.checked);
    chart.update();
    updateStats();
  });
});

document.querySelectorAll('#percentileFilters .chip').forEach(chip => {
  const pct = chip.getAttribute('data-pct');
  const input = chip.querySelector('input');
  chip.addEventListener('click', (e) => {
    e.preventDefault();
    input.checked = !input.checked;
    chip.classList.toggle('off', !input.checked);
    const idx = pctDatasetIndex[pct];
    chart.setDatasetVisibility(idx, input.checked);
    chart.update();
  });
});

updateStats();
</script>
</body>
</html>
